<circle cx="275" cy="215" r="4.5" fill="#243c54"/>
<path d="M275,215 L275,120 L950,120 L950,490 L910,490" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="785" y="110" text-anchor="start" style="font-size:16px;">列地址（CAS 时采样）</text>
<path d="M220,290 L285,290 L285,370 L330,370" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
