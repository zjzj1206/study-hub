<text class="label" x="495.0" y="496.0" text-anchor="middle" style="font-size:18px;">行缓冲（整行）</text>
<path d="M495,410 L495,460" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="730" y="460" width="180" height="60" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="820.0" y="496.0" text-anchor="middle" style="font-size:18px;">列选择</text>
<path d="M660,490 L730,490" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M285,370 L285,435 L820,435 L820,460" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
