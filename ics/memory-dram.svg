<text class="label" x="460" y="546" text-anchor="start" style="font-size:17px;">8 位数据返回控制器</text>
<text class="label" x="40" y="625" text-anchor="start" style="font-size:18px;">模块：8 颗 x8 芯片，共享行 / 列地址，同时各输出 8 位。</text>
