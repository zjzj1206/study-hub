<path d="M500,735 L500,775" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="520" y="774" text-anchor="start" style="font-size:17px;">64-bit 字 → 内存控制器</text>
<text class="label" x="30" y="825" text-anchor="start" style="font-size:17px;">单芯片：RAS 选行并装入行缓冲；CAS 选该行的一列，输出 supercell。图是逻辑组织示意。</text>
</svg>