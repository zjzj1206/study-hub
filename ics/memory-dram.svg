<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">DRAM / 行列复用与芯片位片并行</title><desc id="desc">连线式 SEQ 电路图。实线为数据，虚线为控制，圆点表示分支连接，无圆点交叉不连接。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243c54"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172c45;font-size:18px}.label{paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="1000" height="850" fill="white"/>
<text class="label" x="30" y="38" text-anchor="start" style="font-size:25px;">DRAM / 行列复用与芯片位片并行</text>
<text class="label" x="30" y="72" text-anchor="start" style="font-size:16px;">实线：数据 / 字段　　虚线：控制　　●：连接点　　交叉无点：不连接</text>
<rect x="40" y="180" width="180" height="150" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="130.0" y="261.0" text-anchor="middle" style="font-size:18px;">内存控制器</text>
<rect x="330" y="160" width="330" height="250" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="495.0" y="278.5" text-anchor="middle" style="font-size:18px;">DRAM 阵列</text>
<text class="label" x="495.0" y="303.5" text-anchor="middle" style="font-size:18px;">4 行 × 4 列 supercell</text>
<path d="M350,220 L640,220" fill="none" stroke="#243c54" stroke-width="2.3"/>
<path d="M350,265 L640,265" fill="none" stroke="#243c54" stroke-width="2.3"/>
<path d="M350,310 L640,310" fill="none" stroke="#243c54" stroke-width="2.3"/>
<path d="M410,190 L410,380" fill="none" stroke="#243c54" stroke-width="2.3"/>
