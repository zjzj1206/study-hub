<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="890" viewBox="0 0 1000 890" role="img" aria-labelledby="title desc"><title id="title">WRITE BACK / 写回：两个地址选择器、两个写端口</title><desc id="desc">连线式 SEQ 电路图。实线为数据，虚线为控制，圆点表示分支连接，无圆点交叉不连接。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243c54"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172c45;font-size:18px}.label{paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="1000" height="890" fill="white"/>
<text class="label" x="30" y="38" text-anchor="start" style="font-size:25px;">WRITE BACK / 写回：两个地址选择器、两个写端口</text>
<text class="label" x="30" y="72" text-anchor="start" style="font-size:16px;">实线：数据 / 字段　　虚线：控制　　●：连接点　　交叉无点：不连接</text>
<rect x="290" y="170" width="420" height="180" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<path d="M302 350l8 -12l8 12" fill="none" stroke="#243c54" stroke-width="2"/>
<text class="label" x="500.0" y="253.5" text-anchor="middle" style="font-size:18px;">寄存器堆 R[0…14]</text>
<text class="label" x="500.0" y="278.5" text-anchor="middle" style="font-size:18px;">同一时钟沿更新；同地址时 M 端口优先</text>
<text class="label" x="320" y="332" text-anchor="middle" style="font-size:16px;">dstE</text>
<text class="label" x="435" y="332" text-anchor="middle" style="font-size:16px;">valE</text>
<text class="label" x="560" y="332" text-anchor="middle" style="font-size:16px;">dstM</text>
<text class="label" x="675" y="332" text-anchor="middle" style="font-size:16px;">valM</text>
<path d="M435,490 L435,350" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="435" y="518" text-anchor="middle" style="font-size:16px;">valE ← Execute</text>
<path d="M675,490 L675,350" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="675" y="518" text-anchor="middle" style="font-size:16px;">valM ← Memory</text>
<path d="M80 505L100 430H290L310 505Z" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="195.0" y="463" text-anchor="middle" style="font-size:18px;">dstE</text>
<text class="label" x="137.5" y="492" text-anchor="middle" style="font-size:15px;">0</text>
<text class="label" x="195.0" y="492" text-anchor="middle" style="font-size:15px;">1</text>
<text class="label" x="252.5" y="492" text-anchor="middle" style="font-size:15px;">2</text>
<path d="M195,430 L195,385 L320,385 L320,350" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M137.5,585 L137.5,505" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="137.5" y="610" text-anchor="middle" style="font-size:18px;">rB</text>
<path d="M195.0,585 L195.0,505" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="195.0" y="610" text-anchor="middle" style="font-size:18px;">RRSP</text>
<path d="M252.5,585 L252.5,505" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="252.5" y="610" text-anchor="middle" style="font-size:18px;">RNONE</text>
<path d="M710 505L730 430H920L940 505Z" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="825.0" y="463" text-anchor="middle" style="font-size:18px;">dstM</text>
<text class="label" x="786.6666666666666" y="492" text-anchor="middle" style="font-size:15px;">0</text>
<text class="label" x="863.3333333333334" y="492" text-anchor="middle" style="font-size:15px;">1</text>
<path d="M825,430 L825,385 L560,385 L560,350" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M786.6666666666666,585 L786.6666666666666,505" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="786.6666666666666" y="610" text-anchor="middle" style="font-size:18px;">rA</text>
<path d="M863.3333333333334,585 L863.3333333333334,505" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="863.3333333333334" y="610" text-anchor="middle" style="font-size:18px;">RNONE</text>
<rect x="400" y="590" width="200" height="70" rx="10" fill="#fff2df" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="500.0" y="631.0" text-anchor="middle" style="font-size:18px;">写地址控制</text>
<path d="M445,720 L445,660" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="445" y="743" text-anchor="middle" style="font-size:16px;">icode ← Fetch</text>
<path d="M560,720 L560,660" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="600" y="704" text-anchor="start" style="font-size:16px;">Cnd ← Execute</text>
<path d="M400,620 L340,620 L340,465 L300,465" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<path d="M600,620 L670,620 L670,465 L720,465" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<path d="M125,250 L290,250" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="125" y="230" text-anchor="start" style="font-size:18px;">CLK</text>
<text class="label" x="725" y="190" text-anchor="start" style="font-size:17px;">写使能：</text>
<text class="label" x="725" y="217" text-anchor="start" style="font-size:17px;">E：dstE ≠ RNONE</text>
<text class="label" x="725" y="244" text-anchor="start" style="font-size:17px;">M：dstM ≠ RNONE</text>
<text class="label" x="30" y="811" text-anchor="start" style="font-size:17px;">dstE：rB ← irmovq/OPq 或条件真的 rrmovq/cmovXX；RRSP ← 四类栈操作；其余 RNONE。</text>
<text class="label" x="30" y="838" text-anchor="start" style="font-size:17px;">dstM：rA ← mrmovq/popq；其余 RNONE。rA/rB 来自 Fetch；RRSP 与 RNONE 为常量。</text>
<text class="label" x="30" y="865" text-anchor="start" style="font-size:17px;">E 数据固定为 valE；M 数据固定为 valM。popq %rsp：最终 R[%rsp]=valM，而不是 valE。</text>
</svg>