<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-labelledby="title desc"><title id="title">MEMORY / 访存：地址与写数据分别选择</title><desc id="desc">连线式 SEQ 电路图。实线为数据，虚线为控制，圆点表示分支连接，无圆点交叉不连接。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243c54"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172c45;font-size:18px}.label{paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="1000" height="860" fill="white"/>
<text class="label" x="30" y="38" text-anchor="start" style="font-size:25px;">MEMORY / 访存：地址与写数据分别选择</text>
<text class="label" x="30" y="72" text-anchor="start" style="font-size:16px;">实线：数据 / 字段　　虚线：控制　　●：连接点　　交叉无点：不连接</text>
<rect x="300" y="200" width="400" height="170" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="500.0" y="278.5" text-anchor="middle" style="font-size:18px;">数据内存 M8</text>
<text class="label" x="500.0" y="303.5" text-anchor="middle" style="font-size:18px;">读出组合传播 / 写入在提交时钟沿</text>
<path d="M485,200 L485,115" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="485" y="103" text-anchor="middle" style="font-size:18px;">valM → Write back / PC update</text>
<path d="M700,245 L940,245" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="760" y="230" text-anchor="start" style="font-size:17px;">dmem_error → Stat</text>
<text class="label" x="330" y="350" text-anchor="start" style="font-size:18px;">addr</text>
<text class="label" x="590" y="350" text-anchor="start" style="font-size:18px;">data</text>
<rect x="35" y="220" width="180" height="120" rx="10" fill="#fff2df" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="125.0" y="286.0" text-anchor="middle" style="font-size:18px;">访存控制</text>
<path d="M215,245 L300,245" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="220" y="237" text-anchor="start" style="font-size:14px;">mem_read</text>
<path d="M215,285 L300,285" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="220" y="277" text-anchor="start" style="font-size:14px;">mem_write</text>
<path d="M125,155 L125,220" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="125" y="140" text-anchor="middle" style="font-size:16px;">icode ← Fetch</text>
<path d="M250,390 L250,325 L300,325" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="250" y="412" text-anchor="middle" style="font-size:16px;">CLK</text>
<path d="M150 540L170 465H400L420 540Z" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="285.0" y="498" text-anchor="middle" style="font-size:18px;">mem_addr</text>
<text class="label" x="217.5" y="527" text-anchor="middle" style="font-size:15px;">0</text>
<text class="label" x="285.0" y="527" text-anchor="middle" style="font-size:15px;">1</text>
<text class="label" x="352.5" y="527" text-anchor="middle" style="font-size:15px;">2</text>
<path d="M285,465 L285,420 L360,420 L360,370" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M217.5,610 L217.5,540" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="217.5" y="638" text-anchor="middle" style="font-size:18px;">valE</text>
<path d="M285.0,610 L285.0,540" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="285.0" y="638" text-anchor="middle" style="font-size:18px;">valA</text>
<path d="M352.5,610 L352.5,540" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="352.5" y="638" text-anchor="middle" style="font-size:18px;">0</text>
<path d="M570 540L590 465H820L840 540Z" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="705.0" y="498" text-anchor="middle" style="font-size:18px;">mem_data</text>
<text class="label" x="637.5" y="527" text-anchor="middle" style="font-size:15px;">0</text>
<text class="label" x="705.0" y="527" text-anchor="middle" style="font-size:15px;">1</text>
<text class="label" x="772.5" y="527" text-anchor="middle" style="font-size:15px;">2</text>
<path d="M705,465 L705,420 L620,420 L620,370" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M637.5,610 L637.5,540" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="637.5" y="638" text-anchor="middle" style="font-size:18px;">valA</text>
<path d="M705.0,610 L705.0,540" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="705.0" y="638" text-anchor="middle" style="font-size:18px;">valP</text>
<path d="M772.5,610 L772.5,540" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="772.5" y="638" text-anchor="middle" style="font-size:18px;">0</text>
<path d="M125,340 L125,500 L160,500" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<circle cx="125" cy="405" r="4.5" fill="#b45309"/>
<path d="M125,405 L75,405 L75,685 L920,685 L920,500 L830,500" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="30" y="754" text-anchor="start" style="font-size:17px;">mem_addr：valE ← rmmovq/mrmovq/pushq/call；valA ← popq/ret；其余 0。</text>
<text class="label" x="30" y="781" text-anchor="start" style="font-size:17px;">mem_data：valA ← rmmovq/pushq；valP ← call；其余 0。两者的选择控制均来自 icode。</text>
<text class="label" x="30" y="808" text-anchor="start" style="font-size:17px;">mem_read：mrmovq/popq/ret；mem_write：rmmovq/pushq/call；其余均不使能。</text>
<text class="label" x="30" y="835" text-anchor="start" style="font-size:17px;">valE 来自 Execute；valA 来自 Decode；valP 来自 Fetch。popq/ret 用旧 R[%rsp] 读内存。</text>
</svg>