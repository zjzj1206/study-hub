<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc"><title id="title">DECODE / 译码：源选择器 → 寄存器堆 → valA / valB</title><desc id="desc">连线式 SEQ 电路图。实线为数据，虚线为控制，圆点表示分支连接，无圆点交叉不连接。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243c54"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172c45;font-size:18px}.label{paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="1000" height="800" fill="white"/>
<text class="label" x="30" y="38" text-anchor="start" style="font-size:25px;">DECODE / 译码：源选择器 → 寄存器堆 → valA / valB</text>
<text class="label" x="30" y="72" text-anchor="start" style="font-size:16px;">实线：数据 / 字段　　虚线：控制　　●：连接点　　交叉无点：不连接</text>
<rect x="285" y="180" width="430" height="180" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="500.0" y="263.5" text-anchor="middle" style="font-size:18px;">寄存器堆 R[0…14]</text>
<text class="label" x="500.0" y="288.5" text-anchor="middle" style="font-size:18px;">两个组合读端口</text>
<path d="M390,180 L390,115" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="390" y="103" text-anchor="middle" style="font-size:17px;">valA → Execute / Memory</text>
<path d="M610,180 L610,115" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="610" y="103" text-anchor="middle" style="font-size:17px;">valB → Execute</text>
<text class="label" x="320" y="340" text-anchor="start" style="font-size:18px;">srcA</text>
<text class="label" x="615" y="340" text-anchor="start" style="font-size:18px;">srcB</text>
<path d="M180 520L200 445H410L430 520Z" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="305.0" y="478" text-anchor="middle" style="font-size:18px;">srcA</text>
<text class="label" x="242.5" y="507" text-anchor="middle" style="font-size:15px;">0</text>
<text class="label" x="305.0" y="507" text-anchor="middle" style="font-size:15px;">1</text>
<text class="label" x="367.5" y="507" text-anchor="middle" style="font-size:15px;">2</text>
<path d="M305,445 L305,405 L350,405 L350,360" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M242.5,590 L242.5,520" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="242.5" y="617" text-anchor="middle" style="font-size:18px;">rA</text>
<path d="M305.0,590 L305.0,520" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="305.0" y="617" text-anchor="middle" style="font-size:18px;">RRSP</text>
<path d="M367.5,590 L367.5,520" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="367.5" y="617" text-anchor="middle" style="font-size:18px;">RNONE</text>
<path d="M570 520L590 445H800L820 520Z" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="695.0" y="478" text-anchor="middle" style="font-size:18px;">srcB</text>
<text class="label" x="632.5" y="507" text-anchor="middle" style="font-size:15px;">0</text>
<text class="label" x="695.0" y="507" text-anchor="middle" style="font-size:15px;">1</text>
<text class="label" x="757.5" y="507" text-anchor="middle" style="font-size:15px;">2</text>
<path d="M695,445 L695,405 L650,405 L650,360" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M632.5,590 L632.5,520" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="632.5" y="617" text-anchor="middle" style="font-size:18px;">rB</text>
<path d="M695.0,590 L695.0,520" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="695.0" y="617" text-anchor="middle" style="font-size:18px;">RRSP</text>
<path d="M757.5,590 L757.5,520" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="757.5" y="617" text-anchor="middle" style="font-size:18px;">RNONE</text>
<rect x="430" y="545" width="120" height="65" rx="10" fill="#fff2df" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="490.0" y="583.5" text-anchor="middle" style="font-size:18px;">源选择控制</text>
<path d="M490,650 L490,610" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="490" y="677" text-anchor="middle" style="font-size:18px;">icode ← Fetch</text>
<path d="M430,570 L415,570 L415,545 L455,545 L455,480 L420,480" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<path d="M550,570 L555,570 L555,480 L580,480" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="30" y="721" text-anchor="start" style="font-size:17px;">srcA：rA ← rrmovq/cmovXX、rmmovq、OPq、pushq；RRSP ← popq、ret；其余 RNONE。</text>
<text class="label" x="30" y="748" text-anchor="start" style="font-size:17px;">srcB：rB ← OPq、rmmovq、mrmovq；RRSP ← pushq、popq、call、ret；其余 RNONE。</text>
<text class="label" x="30" y="775" text-anchor="start" style="font-size:17px;">rA/rB 来自 Fetch；RRSP=0x4，RNONE=0xF。读旧状态；写回端口见 Write back 图。</text>
</svg>