<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc"><title id="title">FETCH / 取指：PC → 指令字节 → 字段与顺序地址</title><desc id="desc">连线式 SEQ 电路图。实线为数据，虚线为控制，圆点表示分支连接，无圆点交叉不连接。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243c54"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172c45;font-size:18px}.label{paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="1000" height="880" fill="white"/>
<text class="label" x="30" y="38" text-anchor="start" style="font-size:25px;">FETCH / 取指：PC → 指令字节 → 字段与顺序地址</text>
<text class="label" x="30" y="72" text-anchor="start" style="font-size:16px;">实线：数据 / 字段　　虚线：控制　　●：连接点　　交叉无点：不连接</text>
<rect x="390" y="700" width="110" height="60" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<path d="M402 760l8 -12l8 12" fill="none" stroke="#243c54" stroke-width="2"/>
<text class="label" x="445.0" y="736.0" text-anchor="middle" style="font-size:18px;">PC</text>
<rect x="250" y="540" width="380" height="90" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="440.0" y="591.0" text-anchor="middle" style="font-size:18px;">指令内存</text>
<path d="M445,700 L445,630" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<circle cx="445" cy="665" r="4.5" fill="#243c54"/>
<rect x="270" y="420" width="120" height="60" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="330.0" y="456.0" text-anchor="middle" style="font-size:18px;">Split</text>
<rect x="460" y="420" width="170" height="60" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="545.0" y="456.0" text-anchor="middle" style="font-size:18px;">Align</text>
<path d="M330,540 L330,480" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="335" y="518" text-anchor="start" style="font-size:18px;">Byte 0</text>
<path d="M545,540 L545,480" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="550" y="518" text-anchor="start" style="font-size:18px;">Bytes 1–9</text>
<rect x="240" y="310" width="90" height="60" rx="10" fill="#fff2df" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="285.0" y="346.0" text-anchor="middle" style="font-size:18px;">icode</text>
<rect x="350" y="310" width="90" height="60" rx="10" fill="#fff2df" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="395.0" y="346.0" text-anchor="middle" style="font-size:18px;">ifun</text>
<path d="M185,290 L255,290 L255,310" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="180" y="282" text-anchor="middle" style="font-size:16px;">INOP</text>
<path d="M455,290 L425,290 L425,310" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="445" y="282" text-anchor="middle" style="font-size:16px;">FNONE</text>
<path d="M310,420 L310,390 L285,390 L285,370" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M350,420 L350,390 L395,390 L395,370" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M285,310 L285,115" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="285" y="103" text-anchor="middle" style="font-size:18px;">icode</text>
<path d="M395,310 L395,115" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="395" y="103" text-anchor="middle" style="font-size:18px;">ifun</text>
<path d="M490,420 L490,115" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="490" y="103" text-anchor="middle" style="font-size:18px;">rA</text>
<path d="M550,420 L550,115" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="550" y="103" text-anchor="middle" style="font-size:18px;">rB</text>
<path d="M610,420 L610,115" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="610" y="103" text-anchor="middle" style="font-size:18px;">valC</text>
<rect x="60" y="190" width="120" height="65" rx="10" fill="#fff2df" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="120.0" y="228.5" text-anchor="middle" style="font-size:18px;">Instr valid</text>
<path d="M285,220 L180,220" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<circle cx="285" cy="220" r="4.5" fill="#243c54"/>
<path d="M60,220 L20,220" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="30" y="175" text-anchor="start" style="font-size:16px;">instr_valid → Stat</text>
<rect x="685" y="170" width="125" height="65" rx="10" fill="#fff2df" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="747.5" y="208.5" text-anchor="middle" style="font-size:18px;">Need valC</text>
<rect x="685" y="280" width="125" height="65" rx="10" fill="#fff2df" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="747.5" y="318.5" text-anchor="middle" style="font-size:18px;">Need regids</text>
<path d="M285,145 L655,145 L655,200 L685,200" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<circle cx="285" cy="145" r="4.5" fill="#243c54"/>
<path d="M285,270 L655,270 L655,310 L685,310" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<circle cx="285" cy="270" r="4.5" fill="#243c54"/>
<rect x="865" y="190" width="105" height="140" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="917.5" y="253.5" text-anchor="middle" style="font-size:18px;">PC</text>
<text class="label" x="917.5" y="278.5" text-anchor="middle" style="font-size:18px;">增加</text>
<path d="M445,665 L920,665 L920,330" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M810,200 L865,200" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<path d="M810,310 L835,310 L865,310" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<circle cx="835" cy="310" r="4.5" fill="#b45309"/>
<path d="M835,310 L835,450 L630,450" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<path d="M920,190 L920,115" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="920" y="103" text-anchor="middle" style="font-size:18px;">valP</text>
<path d="M250,585 L210,585 L210,340 L240,340" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<circle cx="210" cy="585" r="4.5" fill="#b45309"/>
<path d="M210,395 L465,395 L465,340 L440,340" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<circle cx="210" cy="395" r="4.5" fill="#b45309"/>
<path d="M210,585 L35,585" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="38" y="565" text-anchor="start" style="font-size:16px;">imem_error → Stat</text>
<text class="label" x="30" y="801" text-anchor="start" style="font-size:17px;">icode / ifun 选择：imem_error=1 → INOP / FNONE；否则取 Split 的高 / 低 4 位。</text>
<text class="label" x="30" y="828" text-anchor="start" style="font-size:17px;">Align：need_regids=1 时分出 rA/rB，否则为 RNONE；常数从 PC+1+need_regids 开始。</text>
<text class="label" x="30" y="855" text-anchor="start" style="font-size:17px;">valP = PC + 1 + need_regids + 8×need_valC；valC 仅在 need_valC=1 时使用。</text>
</svg>