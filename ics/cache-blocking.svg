<path d="M230,190 L230,410" fill="none" stroke="#243c54" stroke-width="2.3"/>
<path d="M65,355 L285,355" fill="none" stroke="#243c54" stroke-width="2.3"/>
<rect x="177" y="247" width="51" height="51" fill="#b7e1db"/>
<text class="label" x="175" y="460" text-anchor="middle" style="font-size:18px;">q × q 子块</text>
<text class="label" x="475" y="140" text-anchor="middle" style="font-size:25px;">B</text>
<rect x="365" y="190" width="220" height="220" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<path d="M420,190 L420,410" fill="none" stroke="#243c54" stroke-width="2.3"/>
<path d="M365,245 L585,245" fill="none" stroke="#243c54" stroke-width="2.3"/>
