<path d="M365,300 L585,300" fill="none" stroke="#243c54" stroke-width="2.3"/>
<path d="M530,190 L530,410" fill="none" stroke="#243c54" stroke-width="2.3"/>
<path d="M365,355 L585,355" fill="none" stroke="#243c54" stroke-width="2.3"/>
<rect x="422" y="302" width="51" height="51" fill="#b7e1db"/>
<text class="label" x="475" y="460" text-anchor="middle" style="font-size:18px;">q × q 子块</text>
<text class="label" x="775" y="140" text-anchor="middle" style="font-size:25px;">C</text>
<rect x="665" y="190" width="220" height="220" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<path d="M720,190 L720,410" fill="none" stroke="#243c54" stroke-width="2.3"/>
<path d="M665,245 L885,245" fill="none" stroke="#243c54" stroke-width="2.3"/>
