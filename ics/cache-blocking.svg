<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc"><title id="title">矩阵分块 / 同时保留 A、B、C 的三个子块</title><desc id="desc">连线式 SEQ 电路图。实线为数据，虚线为控制，圆点表示分支连接，无圆点交叉不连接。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243c54"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172c45;font-size:18px}.label{paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="1000" height="730" fill="white"/>
<text class="label" x="30" y="38" text-anchor="start" style="font-size:25px;">矩阵分块 / 同时保留 A、B、C 的三个子块</text>
<text class="label" x="30" y="72" text-anchor="start" style="font-size:16px;">实线：数据 / 字段　　虚线：控制　　●：连接点　　交叉无点：不连接</text>
<text class="label" x="175" y="140" text-anchor="middle" style="font-size:25px;">A</text>
<rect x="65" y="190" width="220" height="220" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<path d="M120,190 L120,410" fill="none" stroke="#243c54" stroke-width="2.3"/>
