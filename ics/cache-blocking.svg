<path d="M830,190 L830,410" fill="none" stroke="#243c54" stroke-width="2.3"/>
<path d="M665,355 L885,355" fill="none" stroke="#243c54" stroke-width="2.3"/>
<rect x="722" y="247" width="51" height="51" fill="#b7e1db"/>
<text class="label" x="775" y="460" text-anchor="middle" style="font-size:18px;">q × q 子块</text>
<text class="label" x="324" y="300" text-anchor="middle" style="font-size:28px;">×</text>
<text class="label" x="625" y="300" text-anchor="middle" style="font-size:28px;">→</text>
<rect x="230" y="520" width="540" height="70" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="500.0" y="561.0" text-anchor="middle" style="font-size:18px;">C[ii,jj] += A[ii,kk] × B[kk,jj]</text>
<path d="M175,410 L175,555 L230,555" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M475,410 L475,520" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M770,555 L920,555 L920,300 L885,300" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="30" y="678" text-anchor="start" style="font-size:17px;">对固定 C 子块，沿 kk 逐段累加；每个 A/B 子块装入后在内层重复使用。</text>
<text class="label" x="30" y="705" text-anchor="start" style="font-size:17px;">double 元素：三个子块约需 24q² byte；实际选 q 还要留容量和映射余量。</text>
</svg>