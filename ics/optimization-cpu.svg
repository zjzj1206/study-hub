<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc"><title id="title">现代超标量 / 独立操作可并行，架构效果按序确认</title><desc id="desc">连线式 SEQ 电路图。实线为数据，虚线为控制，圆点表示分支连接，无圆点交叉不连接。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243c54"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172c45;font-size:18px}.label{paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="1000" height="830" fill="white"/>
<text class="label" x="30" y="38" text-anchor="start" style="font-size:25px;">现代超标量 / 独立操作可并行，架构效果按序确认</text>
<text class="label" x="30" y="72" text-anchor="start" style="font-size:16px;">实线：数据 / 字段　　虚线：控制　　●：连接点　　交叉无点：不连接</text>
<rect x="300" y="125" width="400" height="80" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="500.0" y="171.0" text-anchor="middle" style="font-size:18px;">取指 / 分支预测 / 译码</text>
<rect x="300" y="270" width="400" height="75" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="500.0" y="313.5" text-anchor="middle" style="font-size:18px;">依赖跟踪 / 调度</text>
<path d="M500,205 L500,270" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="45" y="430" width="200" height="75" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="145.0" y="473.5" text-anchor="middle" style="font-size:18px;">整数 / 分支</text>
<path d="M500,345 L500,380 L145,380 L145,430" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M145,505 L145,565 L500,565 L500,610" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="280" y="430" width="200" height="75" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="380.0" y="473.5" text-anchor="middle" style="font-size:18px;">浮点 / SIMD</text>
<path d="M500,345 L500,380 L380,380 L380,430" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M380,505 L380,565 L500,565 L500,610" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="515" y="430" width="200" height="75" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="615.0" y="473.5" text-anchor="middle" style="font-size:18px;">Load</text>
<path d="M500,345 L500,380 L615,380 L615,430" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M615,505 L615,565 L500,565 L500,610" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="750" y="430" width="200" height="75" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="850.0" y="473.5" text-anchor="middle" style="font-size:18px;">Store</text>
<path d="M500,345 L500,380 L850,380 L850,430" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M850,505 L850,565 L500,565 L500,610" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<rect x="300" y="610" width="400" height="85" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="500.0" y="658.5" text-anchor="middle" style="font-size:18px;">结果缓冲 / 按程序顺序退休</text>
<path d="M500,695 L500,745" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="500" y="775" text-anchor="middle" style="font-size:18px;">确认后的程序可见寄存器与内存效果</text>
<text class="label" x="30" y="325" text-anchor="start" style="font-size:16px;">可用操作</text>
<text class="label" x="35" y="590" text-anchor="start" style="font-size:16px;">不同单元延迟与吞吐可不同</text>
<text class="label" x="30" y="805" text-anchor="start" style="font-size:17px;">示意图，不对应一条指令一个固定执行周期；错误路径候选结果须取消而不能提交。</text>
</svg>