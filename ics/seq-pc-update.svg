<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc"><title id="title">PC UPDATE / 下一 PC：三路选择与反馈</title><desc id="desc">连线式 SEQ 电路图。实线为数据，虚线为控制，圆点表示分支连接，无圆点交叉不连接。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243c54"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172c45;font-size:18px}.label{paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="1000" height="930" fill="white"/>
<text class="label" x="30" y="38" text-anchor="start" style="font-size:25px;">PC UPDATE / 下一 PC：三路选择与反馈</text>
<text class="label" x="30" y="72" text-anchor="start" style="font-size:16px;">实线：数据 / 字段　　虚线：控制　　●：连接点　　交叉无点：不连接</text>
<rect x="365" y="160" width="230" height="85" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<path d="M377 245l8 -12l8 12" fill="none" stroke="#243c54" stroke-width="2"/>
<text class="label" x="480.0" y="208.5" text-anchor="middle" style="font-size:18px;">PC</text>
<path d="M480,160 L480,110" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="480" y="98" text-anchor="middle" style="font-size:18px;">PC → Fetch 指令内存与 PC 增量器</text>
<path d="M265 420L285 345H675L695 420Z" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="480.0" y="378" text-anchor="middle" style="font-size:18px;">new_pc</text>
<text class="label" x="372.5" y="407" text-anchor="middle" style="font-size:15px;">0</text>
<text class="label" x="480.0" y="407" text-anchor="middle" style="font-size:15px;">1</text>
<text class="label" x="587.5" y="407" text-anchor="middle" style="font-size:15px;">2</text>
<path d="M480,345 L480,245" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="495" y="300" text-anchor="start" style="font-size:18px;">new_pc</text>
<path d="M372.5,515 L372.5,420" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="372.5" y="545" text-anchor="middle" style="font-size:18px;">valC</text>
<text class="label" x="372.5" y="570" text-anchor="middle" style="font-size:16px;">Fetch</text>
<path d="M480.0,515 L480.0,420" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="480.0" y="545" text-anchor="middle" style="font-size:18px;">valM</text>
<text class="label" x="480.0" y="570" text-anchor="middle" style="font-size:16px;">Memory</text>
<path d="M587.5,515 L587.5,420" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="587.5" y="545" text-anchor="middle" style="font-size:18px;">valP</text>
<text class="label" x="587.5" y="570" text-anchor="middle" style="font-size:16px;">Fetch</text>
<rect x="760" y="335" width="180" height="90" rx="10" fill="#fff2df" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="850.0" y="386.0" text-anchor="middle" style="font-size:18px;">PC 选择控制</text>
<path d="M760,380 L685,380" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<path d="M795,530 L795,425" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="795" y="554" text-anchor="middle" style="font-size:18px;">icode</text>
<text class="label" x="795" y="578" text-anchor="middle" style="font-size:16px;">Fetch</text>
<path d="M905,530 L905,425" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="905" y="554" text-anchor="middle" style="font-size:18px;">Cnd</text>
<text class="label" x="905" y="578" text-anchor="middle" style="font-size:16px;">Execute</text>
<path d="M265,205 L365,205" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="265" y="190" text-anchor="start" style="font-size:18px;">CLK</text>
<rect x="80" y="685" width="620" height="65" rx="10" fill="#fff2df" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="390.0" y="723.5" text-anchor="middle" style="font-size:18px;">Stat 逻辑</text>
<text class="label" x="145" y="625" text-anchor="middle" style="font-size:16px;">imem_error</text>
<text class="label" x="145" y="647" text-anchor="middle" style="font-size:15px;">Fetch</text>
<path d="M145,655 L145,685" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="305" y="625" text-anchor="middle" style="font-size:16px;">dmem_error</text>
<text class="label" x="305" y="647" text-anchor="middle" style="font-size:15px;">Memory</text>
<path d="M305,655 L305,685" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="465" y="625" text-anchor="middle" style="font-size:16px;">instr_valid</text>
<text class="label" x="465" y="647" text-anchor="middle" style="font-size:15px;">Fetch</text>
<path d="M465,655 L465,685" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="625" y="625" text-anchor="middle" style="font-size:16px;">icode</text>
<text class="label" x="625" y="647" text-anchor="middle" style="font-size:15px;">Fetch</text>
<path d="M625,655 L625,685" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<path d="M700,718 L960,718" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="720" y="700" text-anchor="start" style="font-size:16px;">Stat → 执行 / 停止控制</text>
<text class="label" x="30" y="851" text-anchor="start" style="font-size:17px;">new_pc：call → valC；jXX 且 Cnd=1 → valC；ret → valM；其余 → valP。</text>
<text class="label" x="30" y="878" text-anchor="start" style="font-size:17px;">Stat 优先级：地址错 ADR → 非法类别 INS → halt 的 HLT → 正常 AOK。</text>
<text class="label" x="30" y="905" text-anchor="start" style="font-size:17px;">PC 写入表示正常指令的时钟沿提交；halt/错误停止执行，不能将默认 valP 理解为继续运行。</text>
</svg>