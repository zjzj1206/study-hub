<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc"><title id="title">EXECUTE / 执行：输入选择 → ALU；CC → 条件判断</title><desc id="desc">连线式 SEQ 电路图。实线为数据，虚线为控制，圆点表示分支连接，无圆点交叉不连接。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243c54"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172c45;font-size:18px}.label{paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round}</style>
<rect width="1000" height="1060" fill="white"/>
<text class="label" x="30" y="38" text-anchor="start" style="font-size:25px;">EXECUTE / 执行：输入选择 → ALU；CC → 条件判断</text>
<text class="label" x="30" y="72" text-anchor="start" style="font-size:16px;">实线：数据 / 字段　　虚线：控制　　●：连接点　　交叉无点：不连接</text>
<rect x="370" y="385" width="250" height="100" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="495.0" y="428.5" text-anchor="middle" style="font-size:18px;">ALU</text>
<text class="label" x="495.0" y="453.5" text-anchor="middle" style="font-size:18px;">aluB OP aluA</text>
<path d="M495,385 L495,105" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="495" y="95" text-anchor="middle" style="font-size:17px;">valE → Memory / Write back</text>
<rect x="655" y="245" width="120" height="70" rx="2" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<path d="M667 315l8 -12l8 12" fill="none" stroke="#243c54" stroke-width="2"/>
<text class="label" x="715.0" y="286.0" text-anchor="middle" style="font-size:18px;">CC</text>
<rect x="820" y="145" width="145" height="70" rx="10" fill="#fff2df" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="892.5" y="186.0" text-anchor="middle" style="font-size:18px;">Cond</text>
<path d="M620,410 L715,410 L715,315" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="725" y="373" text-anchor="start" style="font-size:18px;">候选 CC</text>
<path d="M715,245 L715,180 L820,180" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="735" y="168" text-anchor="start" style="font-size:18px;">旧 CC</text>
<path d="M892,145 L892,105" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="892" y="95" text-anchor="middle" style="font-size:17px;">Cnd → 写回 / PC</text>
<path d="M965,265 L965,180" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="965" y="292" text-anchor="end" style="font-size:18px;">ifun</text>
<rect x="55" y="220" width="175" height="95" rx="10" fill="#fff2df" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="142.5" y="261.0" text-anchor="middle" style="font-size:18px;">ALU 控制</text>
<text class="label" x="142.5" y="286.0" text-anchor="middle" style="font-size:18px;">icode / ifun</text>
<path d="M85,140 L85,220" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="85" y="122" text-anchor="middle" style="font-size:16px;">icode ← Fetch</text>
<path d="M195,140 L195,220" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="195" y="170" text-anchor="middle" style="font-size:18px;">ifun</text>
<path d="M230,250 L320,250 L320,420 L370,420" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="245" y="238" text-anchor="start" style="font-size:18px;">alufun</text>
<path d="M230,290 L270,290 L270,345 L640,345 L640,280 L655,280" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="480" y="335" text-anchor="start" style="font-size:16px;">set_cc = (icode == IOPQ)</text>
<path d="M800,350 L800,300 L775,300" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="810" y="355" text-anchor="start" style="font-size:16px;">CLK</text>
<path d="M85 665L105 590H375L395 665Z" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="240.0" y="623" text-anchor="middle" style="font-size:18px;">aluA</text>
<text class="label" x="136.66666666666666" y="652" text-anchor="middle" style="font-size:15px;">0</text>
<text class="label" x="188.33333333333331" y="652" text-anchor="middle" style="font-size:15px;">1</text>
<text class="label" x="240.0" y="652" text-anchor="middle" style="font-size:15px;">2</text>
<text class="label" x="291.66666666666663" y="652" text-anchor="middle" style="font-size:15px;">3</text>
<text class="label" x="343.3333333333333" y="652" text-anchor="middle" style="font-size:15px;">4</text>
<path d="M240,590 L240,535 L420,535 L420,485" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M136.66666666666666,745 L136.66666666666666,665" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="136.66666666666666" y="773" text-anchor="middle" style="font-size:18px;">valA</text>
<path d="M188.33333333333331,745 L188.33333333333331,665" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="188.33333333333331" y="773" text-anchor="middle" style="font-size:18px;">valC</text>
<path d="M240.0,745 L240.0,665" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="240.0" y="773" text-anchor="middle" style="font-size:18px;">−8</text>
<path d="M291.66666666666663,745 L291.66666666666663,665" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="291.66666666666663" y="773" text-anchor="middle" style="font-size:18px;">+8</text>
<path d="M343.3333333333333,745 L343.3333333333333,665" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="343.3333333333333" y="773" text-anchor="middle" style="font-size:18px;">0</text>
<path d="M605 665L625 590H895L915 665Z" fill="#e6f1fc" stroke="#243c54" stroke-width="2.5"/>
<text class="label" x="760.0" y="623" text-anchor="middle" style="font-size:18px;">aluB</text>
<text class="label" x="708.3333333333334" y="652" text-anchor="middle" style="font-size:15px;">0</text>
<text class="label" x="811.6666666666666" y="652" text-anchor="middle" style="font-size:15px;">1</text>
<path d="M760,590 L760,535 L570,535 L570,485" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<path d="M708.3333333333334,745 L708.3333333333334,665" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="708.3333333333334" y="773" text-anchor="middle" style="font-size:18px;">valB</text>
<path d="M811.6666666666666,745 L811.6666666666666,665" fill="none" stroke="#243c54" stroke-width="2.3" marker-end="url(#a)"/>
<text class="label" x="811.6666666666666" y="773" text-anchor="middle" style="font-size:18px;">0</text>
<path d="M140,315 L140,545 L50,545 L50,625 L95,625" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<circle cx="50" cy="625" r="4.5" fill="#b45309"/>
<path d="M50,625 L50,830 L955,830 L955,625 L905,625" fill="none" stroke="#b45309" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#c)"/>
<text class="label" x="500" y="820" text-anchor="middle" style="font-size:16px;">icode 决定两个输入选择器</text>
<text class="label" x="30" y="927" text-anchor="start" style="font-size:17px;">aluA：valA ← rrmovq/cmovXX、OPq；valC ← irmovq、rmmovq、mrmovq；</text>
<text class="label" x="30" y="954" text-anchor="start" style="font-size:17px;">         −8 ← call/pushq；+8 ← ret/popq；其余 0。valA/valB 来自 Decode，valC 来自 Fetch。</text>
<text class="label" x="30" y="981" text-anchor="start" style="font-size:17px;">aluB：valB ← rmmovq、mrmovq、OPq、pushq、popq、call、ret；其余 0。</text>
<text class="label" x="30" y="1008" text-anchor="start" style="font-size:17px;">alufun：OPq 选 ifun，其余选 ALUADD。set_cc 与 CLK 控制候选 CC 的写入。</text>
<text class="label" x="30" y="1035" text-anchor="start" style="font-size:17px;">Cond 使用已保存的 CC 与 Fetch 的 ifun；Cnd 不取本指令 ALU 的候选 CC。</text>
</svg>