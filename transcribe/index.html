<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="粘贴文章，逐行誊抄。支持纸笔跟读和键入校对。">
<title>誊抄工具 · ZJZJ 学习空间</title>
<style>
:root{color-scheme:light;--ink:#18322e;--muted:#536661;--accent:#17634f;--rule:#d7e3db;--paper:#fff;--wash:#edf5f0;--error:#9a251f}
*{box-sizing:border-box}
body{margin:0;background:#f3f7f4;color:var(--ink);font:1rem/1.65 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
header{border-bottom:1px solid var(--rule);background:var(--paper)}
header nav,main{max-width:60rem;margin:auto;padding-inline:clamp(1rem,5vw,2.5rem)}
nav{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding-block:.9rem;font-size:.9rem}
a{color:var(--accent);text-underline-offset:.25em}
.brand{font-weight:750;text-decoration:none}
main{padding-block:clamp(1.6rem,5vw,3.5rem)}
h1,h2,p{margin:0}
h1{font-family:"Songti SC",SimSun,serif;font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.2;letter-spacing:.06em}
h2{font-size:1.12rem}
.intro{margin-bottom:1.5rem}
.intro p,.hint,footer{color:var(--muted)}
.intro p{margin-top:.5rem}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:1rem;padding:clamp(1rem,4vw,2rem);box-shadow:0 10px 30px #18322e09}
label{font-weight:650}
textarea{display:block;width:100%;margin-top:.55rem;border:1px solid #aebfb5;border-radius:.65rem;background:#fbfdfb;color:var(--ink);font:inherit;padding:.85rem;resize:vertical;min-height:6rem}
#source{min-height:14rem}
.controls,.actions,.spread{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem}
.controls{margin:1rem 0}
.controls label{display:flex;align-items:center;gap:.45rem;font-size:.9rem}
.spread{justify-content:space-between}
select,button{min-height:2.75rem;border:1px solid #aebfb5;border-radius:.55rem;background:white;color:var(--ink);font:inherit;padding:.4rem .85rem}
button{cursor:pointer;font-weight:650}
button:hover:not(:disabled){background:var(--wash)}
button:disabled{opacity:.48;cursor:default}
.primary,.primary:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:white}
.primary:hover:not(:disabled){background:#124b3d}
.quiet{border-color:transparent;color:var(--accent)}
:focus-visible{outline:3px solid #218667;outline-offset:3px}
.hint,footer,#line-label{font-size:.875rem}
footer{margin-top:1rem}
progress{display:block;width:100%;height:.6rem;margin:.65rem 0 1.1rem;accent-color:var(--accent);border:0;border-radius:1rem;overflow:hidden;background:var(--wash)}
progress::-webkit-progress-bar{background:var(--wash)}
progress::-webkit-progress-value{background:var(--accent)}
progress::-moz-progress-bar{background:var(--accent)}
.reader{max-height:clamp(12rem,53vh,36rem);overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;border:1px solid var(--rule);border-radius:.7rem;background:#fbfdfb;margin:.55rem 0 1rem;padding:clamp(.45rem,2vw,1rem)}
.reading-row{border-inline-start:3px solid transparent;border-radius:.35rem;padding:.25em .65em;color:#384e47;white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(1.12rem,2.6vw,1.55rem);line-height:1.65;font-family:"Songti SC",SimSun,serif}
.reading-row.paragraph-start:not(:first-child){margin-top:.55em}
.reading-row[aria-current="step"]{background:#e0f2e7;border-inline-start-color:var(--accent);color:#102f25;font-weight:700}
#line-label{color:var(--accent);font-weight:700}
mark{background:#ffdfd5;color:var(--error);border-bottom:2px solid currentColor}
#feedback{min-height:1.65em;font-size:.9rem;margin:.45rem 0 .75rem}
[data-kind="error"]{color:var(--error)}
[data-kind="ok"]{color:var(--accent)}
#finish p{margin:.5rem 0 1rem}
[hidden]{display:none!important}
@media(max-width:36rem){.controls label{justify-content:space-between;width:100%}.actions .primary{flex:1}.card{border-radius:.8rem}}
</style>
</head>
<body>
<header><nav aria-label="网站导航"><a class="brand" href="/">ZJZJ · 学习空间</a><a href="/">返回首页</a></nav></header>
<main>
  <div class="intro"><h1>誊抄工具</h1><p>全文对照，跟着高亮逐句誊抄。</p></div>
  <form id="setup" class="card">
    <label for="source">粘贴原文</label>
    <textarea id="source" required placeholder="把需要誊抄的文章粘贴到这里……" spellcheck="false"></textarea>
    <div class="controls">
      <label for="mode">誊抄方式
        <select id="mode"><option value="paper">纸笔跟读</option><option value="typing">键入校对</option></select>
      </label>
      <label for="width">每行建议长度
        <select id="width"><option value="16">16 字</option><option value="24" selected>24 字</option><option value="32">32 字</option><option value="48">48 字</option></select>
      </label>
    </div>
    <div class="actions"><button class="primary" id="start">开始誊抄</button><button type="button" class="quiet" id="example">填入示例</button></div>
  </form>
  <section id="work" class="card" aria-label="誊抄工作区" hidden>
    <div class="spread"><h2 id="progress-label">誊抄进度</h2><button type="button" class="quiet" id="edit">编辑原文</button></div>
    <progress id="progress" aria-labelledby="progress-label"></progress>
    <div class="spread"><h2 id="article-heading">原文</h2><p id="line-label" role="status"></p></div>
    <article class="reader" id="article" aria-labelledby="article-heading" tabindex="0"></article>
    <form id="row-form">
      <div id="typing" hidden>
        <label for="draft">输入当前行</label>
        <input id="draft" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="feedback">
      </div>
      <p id="feedback" role="status"></p>
      <div class="actions"><button type="button" id="previous">上一行</button><button type="submit" class="primary" id="next">抄完，下一行</button></div>
    </form>
    <div id="finish" hidden>
      <h2 id="finish-heading" tabindex="-1">全文誊抄完成</h2>
      <p id="finish-summary"></p>
      <div class="actions"><button type="button" id="review">查看最后一行</button><button type="button" class="primary" id="another">换一篇</button></div>
    </div>
  </section>
  <footer id="storage-note">原文和进度仅保存在此浏览器。</footer>
</main>
<style>
#draft{display:block;width:100%;margin-top:.5rem;border:1px solid #aebfb5;border-radius:.65rem;background:#fbfdfb;color:var(--ink);font:inherit;padding:.75rem}
#draft[aria-invalid=true]{border-color:var(--error)}
</style>
<script>
const $ = id => document.getElementById(id);
const storageKey = 'zjzj.transcribe.v2';
const legacyKey = 'zjzj.transcribe.v1';
const segmenter = typeof Intl.Segmenter === 'function' ? new Intl.Segmenter('zh', {granularity: 'grapheme'}) : null;
const characters = text => segmenter ? Array.from(segmenter.segment(text), part => part.segment) : Array.from(text);
const widths = [16, 24, 32, 48];

const closing = /^[」』”’"）)】\]〉》〕}]+$/u;
const opening = /^[「『“‘（(【\[〈《〔{]+$/u;
const clauseEnd = /^[，、；：,;:]+$/u;
const wordChar = /^[\p{Script=Latin}\d]$/u;

function sentenceEnd(chars, i) {
  const char = chars[i];
  if (/^[。！？!?…]$/u.test(char)) return true;
  return char === '.' && (!chars[i + 1] || /\s/u.test(chars[i + 1]) || closing.test(chars[i + 1]));
}

function chooseBreak(chars, start, width) {
  const limit = Math.min(start + width, chars.length);
  let clause = 0;
  let space = 0;
  const earliest = start + Math.ceil(width / 2);
  for (let i = start; i < limit; i++) {
    if (sentenceEnd(chars, i)) {
      let end = i + 1;
      while (end < chars.length && (sentenceEnd(chars, end) || closing.test(chars[end]))) end++;
      return end;
    }
    if (i + 1 >= earliest && clauseEnd.test(chars[i])) clause = i + 1;
    if (i + 1 >= earliest && /\s/u.test(chars[i])) space = i + 1;
  }
  if (limit === chars.length) return limit;

  let end = limit;
  if (sentenceEnd(chars, end) || closing.test(chars[end]) || clauseEnd.test(chars[end])) {
    while (end < chars.length && (sentenceEnd(chars, end) || closing.test(chars[end]) || clauseEnd.test(chars[end]))) end++;
    return end;
  }
  if (clause) return clause;
  if (wordChar.test(chars[end - 1]) && wordChar.test(chars[end]) && space) return space;
  if (end > start + 1 && opening.test(chars[end - 1])) end--;
  return end;
}

function legacyBreak(chars, start, width) {
  const end = Math.min(start + width, chars.length);
  const latinOrDigit = /[\p{Script=Latin}\d]/u;
  if (end < chars.length && latinOrDigit.test(chars[end - 1]) && latinOrDigit.test(chars[end])) {
    const space = chars.slice(start, end).findLastIndex(char => /\s/u.test(char));
    if (space > 0) return start + space + 1;
  }
  return end;
}

function splitLines(text, width, cut = chooseBreak) {
  let offset = 0;
  return text.replace(/\r\n?/g, '\n').split('\n').flatMap((paragraph, index) => {
    const trimmed = paragraph.trim();
    const chars = characters(trimmed);
    const indent = paragraph.length - paragraph.trimStart().length;
    let position = offset + indent;
    offset += paragraph.length + 1;
    const rows = [];
    for (let start = 0; start < chars.length;) {
      const end = cut(chars, start, width);
      const raw = chars.slice(start, end).join('');
      if (raw.trim()) {
        rows.push({
          text: raw.trim(),
          prefix: (start === 0 ? paragraph.slice(0, indent) : '') + raw.slice(0, raw.length - raw.trimStart().length),
          suffix: raw.slice(raw.trimEnd().length),
          start: position + raw.length - raw.trimStart().length,
          end: position + raw.trimEnd().length,
          sourceLine: index + 1
        });
      }
      position += raw.length;
      start = end;
      if (cut === chooseBreak) {
        while (start < chars.length && /\s/u.test(chars[start])) position += chars[start++].length;
      }
    }
    return rows;
  });
}

function migrateProgress(saved, nextRows) {
  const oldRows = splitLines(saved.source, saved.width, legacyBreak);
  if (!oldRows.length || !Number.isInteger(saved.index) || !Number.isInteger(saved.done) ||
      saved.index < 0 || saved.index > saved.done || saved.done > oldRows.length) return null;

  const completedEnd = oldRows[saved.done - 1]?.end ?? 0;
  const done = nextRows.filter(row => row.end <= completedEnd).length;
  const currentStart = oldRows[saved.index]?.start ?? Infinity;
  const current = nextRows.findIndex(row => row.end > currentStart);
  const index = current === -1 ? done : Math.min(current, done);
  const drafts = {};
  if (saved.mode === 'typing') {
    const oldIndices = new Map(oldRows.map((row, i) => [row.start, i]));
    nextRows.forEach((row, i) => {
      const oldIndex = oldIndices.get(row.start);
      const previousDraft = saved.drafts?.[oldIndex];
      if (i < done) drafts[i] = row.text;
      else if (oldRows[oldIndex]?.end === row.end && typeof previousDraft === 'string') drafts[i] = previousDraft;
    });
  }
  return {...saved, index, done, drafts};
}

function difference(expected, actual) {
  const reference = characters(expected.normalize('NFC'));
  const entered = characters(actual.normalize('NFC'));
  let index = 0;
  while (index < reference.length && reference[index] === entered[index]) index++;
  return {reference, entered, index, exact: index === reference.length && index === entered.length};
}

let state = null;
let rows = [];
let editing = true;
let composing = false;
let renderedRows = null;
let rowElements = [];
let activeRow = null;

function renderArticle() {
  if (renderedRows !== rows) {
    const fragment = document.createDocumentFragment();
    rowElements = rows.map((row, index) => {
      const node = document.createElement('p');
      node.className = 'reading-row';
      if (rows[index - 1]?.sourceLine !== row.sourceLine) node.classList.add('paragraph-start');
      node.textContent = row.prefix + row.text + row.suffix;
      fragment.append(node);
      return node;
    });
    $('article').replaceChildren(fragment);
    renderedRows = rows;
    activeRow = null;
  }
  const current = rowElements[state.index] ?? null;
  if (current === activeRow) return;
  if (activeRow) {
    const previous = rows[rowElements.indexOf(activeRow)];
    activeRow.textContent = previous.prefix + previous.text + previous.suffix;
    activeRow.removeAttribute('aria-current');
  }
  activeRow = current;
  if (!activeRow) return;
  activeRow.setAttribute('aria-current', 'step');
  const reader = $('article');
  const viewport = reader.getBoundingClientRect();
  const line = activeRow.getBoundingClientRect();
  reader.scrollTop += line.top - viewport.top - (reader.clientHeight - line.height) / 2;
}

function save() {
  try {
    if (state) localStorage.setItem(storageKey, JSON.stringify(state));
    else localStorage.removeItem(storageKey);
    localStorage.removeItem(legacyKey);
  } catch {
    $('storage-note').textContent = '浏览器无法保存进度，请保持此页面打开。';
  }
}

function render(focus = false) {
  $('setup').hidden = !editing;
  $('work').hidden = editing;
  if (editing) {
    if (focus) $('source').focus();
    return;
  }
  renderArticle();
  const complete = state.index === rows.length;
  $('progress').max = rows.length;
  $('progress').value = state.done;
  $('progress-label').textContent = `已完成 ${state.done} / ${rows.length} 行`;
  $('finish').hidden = !complete;
  $('row-form').hidden = complete;
  if (complete) {
    $('line-label').textContent = '';
    $('finish-summary').textContent = `已逐行完成，共 ${rows.length} 行。`;
    if (focus) $('finish-heading').focus();
    return;
  }
  const row = rows[state.index];
  $('line-label').textContent = `第 ${state.index + 1} 行 · 原文第 ${row.sourceLine} 行`;
  const typing = state.mode === 'typing';
  $('typing').hidden = !typing;
  $('draft').value = state.drafts[state.index] ?? '';
  $('previous').disabled = state.index === 0;
  $('next').textContent = typing ? '校对并继续' : '抄完，下一行';
  showComparison();
  if (focus) (typing ? $('draft') : $('next')).focus();
}

function showComparison(submitted = false) {
  const row = rows[state.index];
  const line = activeRow;
  const feedback = $('feedback');
  line.textContent = row.prefix + row.text + row.suffix;
  feedback.dataset.kind = '';
  $('draft').removeAttribute('aria-invalid');
  if (state.mode === 'paper') {
    feedback.textContent = '请对照纸上的字和标点，核对后再继续。';
    return true;
  }
  const {reference, entered, index, exact} = difference(row.text, $('draft').value);
  if (exact) {
    feedback.dataset.kind = 'ok';
    feedback.textContent = '本行一致，可以继续。';
    return true;
  }
  if (index === entered.length && !submitted) {
    feedback.textContent = entered.length ? `已对上前 ${index} 字。` : '逐字核对，包含空格和标点。';
    return false;
  }
  if (index < reference.length) {
    const original = characters(row.text);
    const highlight = document.createElement('mark');
    highlight.textContent = original[index] === ' ' ? '␣' : original[index];
    line.replaceChildren(row.prefix + original.slice(0, index).join(''), highlight, original.slice(index + 1).join('') + row.suffix);
  }
  feedback.dataset.kind = 'error';
  $('draft').setAttribute('aria-invalid', 'true');
  const describe = char => char === ' ' ? '空格' : `「${char}」`;
  if (index === reference.length) feedback.textContent = `行末多了 ${entered.length - index} 个字符。`;
  else if (index === entered.length) feedback.textContent = `本行还没抄完，第 ${index + 1} 字是 ${describe(reference[index])}。`;
  else feedback.textContent = `第 ${index + 1} 字不同：原文是 ${describe(reference[index])}，输入了 ${describe(entered[index])}。`;
  return false;
}

$('setup').addEventListener('submit', event => {
  event.preventDefault();
  const source = $('source').value;
  const width = Number($('width').value);
  const mode = $('mode').value;
  rows = splitLines(source, width);
  if (!rows.length) {
    $('source').setCustomValidity('请粘贴包含文字的原文。');
    $('source').reportValidity();
    return;
  }
  if (!state || state.source !== source || state.width !== width || state.mode !== mode) {
    state = {source, width, mode, index: 0, done: 0, drafts: {}};
  }
  editing = false;
  save();
  render(true);
});

$('source').addEventListener('input', () => $('source').setCustomValidity(''));
$('example').addEventListener('click', () => {
  if ($('source').value.trim()) {
    $('source').focus();
    return;
  }
  $('source').value = '山间的雾慢慢散开，天边亮了起来。村庄还很安静。\n\n清晨的风穿过树梢，几声鸟鸣落在石径上，远处的炊烟也跟着晨光慢慢升起。';
  $('source').setCustomValidity('');
  $('source').focus();
});

function updateDraft() {
  state.drafts[state.index] = $('draft').value;
  if (state.index < state.done && !difference(rows[state.index].text, $('draft').value).exact) {
    state.done = state.index;
    $('progress').value = state.done;
    $('progress-label').textContent = `已完成 ${state.done} / ${rows.length} 行`;
  }
  save();
  showComparison();
}
$('draft').addEventListener('compositionstart', () => { composing = true; });
$('draft').addEventListener('compositionend', () => { composing = false; updateDraft(); });
$('draft').addEventListener('input', event => { if (!composing && !event.isComposing) updateDraft(); });
$('draft').addEventListener('keydown', event => {
  if (event.key === 'Enter' && (event.isComposing || composing || event.keyCode === 229)) event.preventDefault();
});

$('row-form').addEventListener('submit', event => {
  event.preventDefault();
  if (composing) return;
  if (!showComparison(true)) {
    $('draft').focus();
    return;
  }
  state.index++;
  state.done = Math.max(state.done, state.index);
  save();
  render(true);
});
function back() {
  state.index = Math.max(0, state.index - 1);
  save();
  render(true);
}
$('previous').addEventListener('click', back);
$('review').addEventListener('click', back);
$('edit').addEventListener('click', () => {
  editing = true;
  $('start').textContent = '继续誊抄';
  render(true);
});
$('another').addEventListener('click', () => {
  state = null;
  editing = true;
  $('source').value = '';
  $('start').textContent = '开始誊抄';
  save();
  render(true);
});
for (const id of ['source', 'mode', 'width']) {
  $(id).addEventListener('input', () => {
    $('start').textContent = state && $('source').value === state.source && $('mode').value === state.mode && Number($('width').value) === state.width
      ? '继续誊抄' : '开始誊抄';
  });
}

try {
  const stored = localStorage.getItem(storageKey);
  let saved = JSON.parse(stored ?? localStorage.getItem(legacyKey));
  if (saved && typeof saved.source === 'string' && widths.includes(saved.width) && ['paper', 'typing'].includes(saved.mode)) {
    rows = splitLines(saved.source, saved.width);
    if (rows.length && stored === null) saved = migrateProgress(saved, rows);
    if (saved && rows.length && Number.isInteger(saved.index) && Number.isInteger(saved.done) &&
        saved.index >= 0 && saved.index <= saved.done && saved.done <= rows.length &&
        saved.drafts && typeof saved.drafts === 'object') {
      state = saved;
      $('source').value = state.source;
      $('mode').value = state.mode;
      $('width').value = state.width;
      editing = false;
      if (stored === null) save();
    }
  }
} catch {
  // A blocked or invalid saved session cannot prevent a new session.
}
render();
</script>
</body>
</html>
